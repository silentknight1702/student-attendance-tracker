version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: attendance_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - attendance_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/attendance
      JWT_SECRET: your_jwt_secret_key
      SOCKET_IO_CORS_ORIGIN: http://localhost:3000,http://localhost:3001
    depends_on:
      - mongodb
    networks:
      - attendance_network

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: attendance_admin
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - attendance_network

volumes:
  mongodb_data:

networks:
  attendance_network:
    driver: bridge
